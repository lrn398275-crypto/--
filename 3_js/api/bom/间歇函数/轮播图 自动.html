    let i = 1
    const activeimg = document.querySelector('img')
    const text = document.querySelector('.text')

    //li获取删掉的


    //图片事件

    activeimg.src = `../图片练习/zs0${i}.jpg`
    //按钮
    const next = document.querySelector('.btn2')
    next.addEventListener('click', function next() {
      i++
      if (i === 6) { i = 1 }
      toggle()
    })


    const font = document.querySelector('.btn1')
    font.addEventListener('click', function () {
      i--
      if (i === 0) { i = 5 }
      toggle()
    })

    //复用
    function toggle() {
      activeimg.src = `../图片练习/zs0${i}.jpg`
      //文字事件
      text.innerHTML = `第${i}张`
      //删掉之前的
      const lastli = document.querySelector('ul .active')
      lastli.classList.remove('active')
      //li添加
      console.log(i)
      const activeli = document.querySelector(`ul li:nth-child(${i})`)
      activeli.classList.add('active')
    }

    //自动播放
    let timeId = setInterval(function () {
      //js自动调用点击事件
      next.click()
    }, 1000)
    //焦点
    const box = document.querySelector('.box')
    box.addEventListener('mouseenter', function () {
      clearInterval(timeId)
    })
    box.addEventListener('mouseleave', function () {
      timeId = setInterval(function () {
        //js自动调用点击事件
        next.click()
      }, 1000)
    })
