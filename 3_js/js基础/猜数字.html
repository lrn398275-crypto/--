<!DOCTYPE html>
<html lang="zh-Cn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let truenum = Math.floor((Math.random() * 10) + 1)
    while (1) {
      let gusnum = prompt('开猜',)
      if (gusnum > truenum) {
        alert('猜大了')
      }
      else if (gusnum < truenum) {
        alert('猜小了')
      }
      else {
        alert('猜对了')
        break
      }

    }
  </script>
</body>

</html>
