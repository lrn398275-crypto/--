    function transTime(scends) {
      let fen = Math.floor(scends / 60)
      let miao = scends % 60
      let shi = 0
      while (fen >= 60) {
        fen -= 60
        shi++
      }

      return `现在是${shi}时${fen}分${miao}秒`
    }
    let zmiao = +prompt('给我秒')
    document.write(transTime(zmiao))
